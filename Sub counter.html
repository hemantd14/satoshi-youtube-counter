<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* Transparent OBS canvas */
    .container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Everything is stacked vertically */
    .stack {
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .card {
        width: 100%;
        padding: 18px 24px 20px;

        background: rgba(0, 0, 0, 0.58);

        border: 2px solid rgba(255, 255, 255, 0.88);
        border-radius: 16px;

        color: #ffffff;
        text-align: center;

        box-shadow:
            0 5px 18px rgba(0, 0, 0, 0.35),
            inset 0 0 12px rgba(255, 255, 255, 0.035);
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1.15;
    }

    .youtube-icon {
        width: 30px;
        height: 21px;
        border-radius: 6px;
        background: #ff0000;

        position: relative;
        flex: 0 0 auto;
    }

    .youtube-icon::after {
        content: "";
        position: absolute;
        left: 12px;
        top: 5px;

        border-left: 9px solid #ffffff;
        border-top: 5.5px solid transparent;
        border-bottom: 5.5px solid transparent;
    }

    .label {
        margin-top: 7px;

        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;

        opacity: 0.62;
    }

    .count {
        margin-top: 5px;

        font-size: 58px;
        line-height: 1;

        font-weight: 900;
        letter-spacing: 1px;

        text-shadow:
            0 2px 5px rgba(0, 0, 0, 0.75),
            0 0 14px rgba(255, 255, 255, 0.18);

        white-space: nowrap;
    }

    .status {
        margin-top: 9px;

        font-size: 9px;
        font-weight: 600;
        letter-spacing: 1.5px;

        opacity: 0.42;
    }

    .pulse {
        animation: pulse 0.5s ease;
    }

    @keyframes pulse {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.08); }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<div class="container">

    <div class="stack">

        <!-- =========================================
             YOUTUBE SUBSCRIBER CARD
             ========================================= -->

        <div class="card">

            <div class="header">
                <span class="youtube-icon"></span>
                <span>YOUTUBE SUBSCRIBERS</span>
            </div>

            <div id="count" class="count">---</div>

            <div id="subscriberStatus" class="status">
                CONNECTING...
            </div>

        </div>


        <!-- =========================================
             RAZORPAY SUPPORT CARD - DISABLED FOR NOW
             
             Kept here for future use.
             ========================================= -->

        <!--

        <div class="card">

            <div class="header">
                <span class="heart">♥</span>
                <span>SUPPORT</span>
            </div>

            <div id="amount" class="amount">₹0</div>

            <div id="supportStatus" class="status">
                CONNECTING...
            </div>

        </div>

        -->


    </div>

</div>


<script>

/* =========================================
   YOUTUBE API ENDPOINT
   ========================================= */

const SUBSCRIBER_API =
    "/api/youtube/subscribers";


/* =========================================
   RAZORPAY API ENDPOINT - DISABLED
   ========================================= */

/*
const SUPPORT_API =
    "/api/razorpay/total";
*/


/* =========================================
   SETTINGS
   ========================================= */

const SUBSCRIBER_REFRESH_INTERVAL = 30000;


/*
const SUPPORT_REFRESH_INTERVAL = 15000;
*/


let previousCount = null;


/*
let previousAmount = null;
*/


/* =========================================
   YOUTUBE SUBSCRIBERS
   ========================================= */

async function updateSubscribers() {

    try {

        const response = await fetch(
            SUBSCRIBER_API + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server returned " + response.status
            );

        }


        const data = await response.json();


        if (
            typeof data.subscribers !== "number"
        ) {

            throw new Error(
                "Invalid subscriber data"
            );

        }


        const countElement =
            document.getElementById("count");


        countElement.textContent =
            data.subscribers.toLocaleString("en-IN") + "/100";


        document.getElementById("subscriberStatus")
            .textContent =
            "LIVE • UPDATES EVERY 30 SECONDS";


        /* Animate when subscriber count changes */

        if (
            previousCount !== null &&
            data.subscribers !== previousCount
        ) {

            countElement.classList.remove("pulse");

            void countElement.offsetWidth;

            countElement.classList.add("pulse");

        }


        previousCount =
            data.subscribers;


    } catch (error) {

        console.error(
            "Subscriber counter error:",
            error
        );


        document.getElementById("subscriberStatus")
            .textContent =
            "CONNECTION ERROR";

    }

}
