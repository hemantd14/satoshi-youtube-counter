<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================
   MAIN CONTAINER
   ========================================= */

.container {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

}


.stack {

    width: 420px;

    display: flex;

    flex-direction: column;

    gap: 14px;

}


/* =========================================
   CARD
   ========================================= */

.card {

    width: 100%;

    padding:
        18px
        24px
        20px;

    background:
        rgba(0, 0, 0, 0.58);

    border:
        2px solid
        rgba(255, 255, 255, 0.88);

    border-radius: 16px;

    color: #ffffff;

    text-align: center;

    box-shadow:

        0 5px 18px
        rgba(0, 0, 0, 0.35),

        inset 0 0 12px
        rgba(255, 255, 255, 0.035);

}


/* =========================================
   HEADER
   ========================================= */

.header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 2px;

    line-height: 1.15;

}


/* =========================================
   YOUTUBE ICON
   ========================================= */

.youtube-icon {

    width: 30px;
    height: 21px;

    border-radius: 6px;

    background: #ff0000;

    position: relative;

    flex: 0 0 auto;

}


.youtube-icon::after {

    content: "";

    position: absolute;

    left: 12px;
    top: 5px;

    border-left:
        9px solid #ffffff;

    border-top:
        5.5px solid transparent;

    border-bottom:
        5.5px solid transparent;

}


/* =========================================
   LIKE ICON
   ========================================= */

.like-icon {

    font-size: 25px;

    line-height: 1;

}


/* =========================================
   COUNT
   ========================================= */

.count {

    margin-top: 8px;

    font-size: 58px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:

        0 2px 5px
        rgba(0, 0, 0, 0.75),

        0 0 14px
        rgba(255, 255, 255, 0.18);

    white-space: nowrap;

}


/* =========================================
   STATUS
   ========================================= */

.status {

    margin-top: 9px;

    font-size: 9px;

    font-weight: 600;

    letter-spacing: 1.5px;

    opacity: 0.42;

}


/* =========================================
   ANIMATION
   ========================================= */

.pulse {

    animation:
        pulse 0.5s ease;

}


@keyframes pulse {

    0% {

        transform:
            scale(1);

    }

    40% {

        transform:
            scale(1.08);

    }

    100% {

        transform:
            scale(1);

    }

}


/* =========================================
   GOAL COMPLETE
   ========================================= */

.goalComplete {

    animation:
        goalComplete 0.8s ease;

}


@keyframes goalComplete {

    0% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.15);

    }

    100% {

        transform:
            scale(1);

    }

}

</style>

</head>


<body>


<div class="container">


<div class="stack">


<!-- =========================================
     SUBSCRIBER CARD
     ========================================= -->

<div class="card">


    <div class="header">

        <span class="youtube-icon"></span>

        <span>
            YOUTUBE SUBSCRIBERS
        </span>

    </div>


    <div
        id="subscriberCount"
        class="count"
    >

        ---

    </div>


    <div
        id="subscriberStatus"
        class="status"
    >

        CONNECTING...

    </div>


</div>



<!-- =========================================
     LIKE CARD
     ========================================= -->

<div class="card">


    <div class="header">

        <span class="like-icon">
            👍
        </span>

        <span>
            STREAM LIKES
        </span>

    </div>


    <div
        id="likeCount"
        class="count"
    >

        ---

    </div>


    <div
        id="likeStatus"
        class="status"
    >

        CONNECTING...

    </div>


</div>



</div>


</div>



<script>


/* =========================================
   API
   ========================================= */

const SUBSCRIBER_API =
    "/api/youtube/subscribers";

const LIKE_API =
    "/api/youtube/likes";


/* =========================================
   OBS REFRESH
   ========================================= */

/*
   OBS can refresh every second.

   Render will NOT call YouTube every second.
   The server will cache the YouTube data.
*/

const REFRESH_INTERVAL =
    1000;


let previousSubscribers =
    null;


let previousLikes =
    null;


/* =========================================
   SUBSCRIBERS
   ========================================= */

async function updateSubscribers() {

    try {

        const response =
            await fetch(
                SUBSCRIBER_API +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            typeof data.subscribers !==
            "number"
        ) {

            throw new Error(
                "Invalid subscriber data"
            );

        }


        const count =
            data.subscribers;


        const goal =
            data.subscriberGoal;


        const element =
            document.getElementById(
                "subscriberCount"
            );


        element.textContent =
            count
            .toLocaleString("en-IN")
            + "/"
            + goal;


        document.getElementById(
            "subscriberStatus"
        ).textContent =
            "LIVE • SUBSCRIBER GOAL";


        if (
            previousSubscribers !== null &&
            count !== previousSubscribers
        ) {

            element.classList.remove(
                "pulse"
            );

            void element.offsetWidth;

            element.classList.add(
                "pulse"
            );

        }


        previousSubscribers =
            count;


    } catch (error) {

        console.error(
            "Subscriber error:",
            error
        );


        document.getElementById(
            "subscriberStatus"
        ).textContent =
            "CONNECTION ERROR";

    }

}



/* =========================================
   LIKES
   ========================================= */

async function updateLikes() {

    try {

        const response =
            await fetch(
                LIKE_API +
                "?t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server returned " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            typeof data.likes !==
            "number"
        ) {

            throw new Error(
                "Invalid like data"
            );

        }


        const likes =
            data.likes;


        const goal =
            data.likeGoal;


        const element =
            document.getElementById(
                "likeCount"
            );


        element.textContent =
            likes
            + "/"
            + goal;


        document.getElementById(
            "likeStatus"
        ).textContent =
            "LIVE • STREAM LIKE GOAL";


        if (
            previousLikes !== null &&
            likes !== previousLikes
        ) {

            element.classList.remove(
                "pulse"
            );

            void element.offsetWidth;

            element.classList.add(
                "pulse"
            );

        }


        previousLikes =
            likes;


    } catch (error) {

        console.error(
            "Like error:",
            error
        );


        document.getElementById(
            "likeStatus"
        ).textContent =
            "WAITING FOR LIVE DATA";

    }

}



/* =========================================
   START
   ========================================= */

updateSubscribers();

updateLikes();


/* =========================================
   REFRESH
   ========================================= */

setInterval(
    updateSubscribers,
    REFRESH_INTERVAL
);


setInterval(
    updateLikes,
    REFRESH_INTERVAL
);


/* =========================================
   RAZORPAY REMAINS DISABLED
   ========================================= */

/*

Razorpay support code intentionally
remains disabled for now.

*/

</script>


</body>

</html>
